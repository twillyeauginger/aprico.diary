openapi: 3.1.0
info:
  title: Aprico Diary ChatGPT Action
  version: 1.0.0
  description: |
    Aprico Diary의 개인 음식 DB와 식사 기록을 관리합니다.
    POST와 DELETE는 반드시 실행 전에 사용자에게 변경 내용을 요약하고 명시적인 확인을 받은 뒤 호출하세요.
servers:
  - url: https://lexsvklkikuggtyrkzrk.supabase.co/functions/v1/chatgpt-api/api/chatgpt
security:
  - bearerAuth: []
paths:
  /foods:
    post:
      operationId: createFood
      summary: 내 음식 DB에 식품 등록
      description: 실행 전에 음식명, 기준량, 칼로리와 탄단지를 사용자에게 보여주고 등록 확인을 받아야 합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FoodInput"
      responses:
        "201": { description: 등록 성공 }
        "400": { description: 잘못된 요청 }
        "401": { description: 인증 실패 }
  /foods/search:
    get:
      operationId: searchFoods
      summary: 내 음식 DB 검색
      parameters:
        - in: query
          name: query
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200": { description: 검색 결과 }
  /meal-entries:
    post:
      operationId: createMealEntry
      summary: 식사 기록 등록
      description: 실행 전에 먹은 시각, 식사 구분, 음식명, 양과 영양정보를 사용자에게 보여주고 등록 확인을 받아야 합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MealEntryInput"
      responses:
        "201": { description: 등록 성공 }
        "200": { description: 이미 존재하는 중복 기록 }
    get:
      operationId: listMealEntriesByDate
      summary: 일별 식사 기록 조회
      parameters:
        - in: query
          name: date
          required: true
          schema: { type: string, format: date }
      responses:
        "200": { description: Asia/Seoul 기준 일별 기록 }
  /meal-entries/{id}:
    delete:
      operationId: deleteMealEntry
      summary: 잘못 등록한 식사 기록 삭제
      description: 실행 전에 삭제할 기록을 사용자에게 보여주고 명시적인 삭제 확인을 받아야 합니다.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: 삭제 성공 }
        "404": { description: 기록 없음 }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    FoodInput:
      type: object
      required: [name, servingAmount, servingUnit, caloriesKcal, carbohydratesGrams, proteinGrams, fatGrams]
      properties:
        name: { type: string, minLength: 1 }
        servingAmount: { type: number, minimum: 0 }
        servingUnit: { type: string, enum: [g, kg, ml, l, 개, 인분, 공기, 컵, 큰술, 작은술] }
        weightGrams: { type: [number, "null"], minimum: 0 }
        caloriesKcal: { type: number, minimum: 0 }
        carbohydratesGrams: { type: number, minimum: 0 }
        proteinGrams: { type: number, minimum: 0 }
        fatGrams: { type: number, minimum: 0 }
        sodiumMilligrams: { type: [number, "null"], minimum: 0 }
        sugarsGrams: { type: [number, "null"], minimum: 0 }
        source: { type: [string, "null"] }
        notes: { type: [string, "null"] }
    MealEntryInput:
      type: object
      required: [eatenAt, mealType, foodName, amount, unit, caloriesKcal, carbohydratesGrams, proteinGrams, fatGrams]
      properties:
        eatenAt: { type: string, format: date-time }
        mealType: { type: string, enum: [breakfast, lunch, dinner, snack] }
        foodName: { type: string, minLength: 1 }
        amount: { type: number, minimum: 0 }
        unit: { type: string, enum: [g, kg, ml, l, 개, 인분, 공기, 컵, 큰술, 작은술] }
        weightGrams: { type: [number, "null"], minimum: 0 }
        caloriesKcal: { type: number, minimum: 0 }
        carbohydratesGrams: { type: number, minimum: 0 }
        proteinGrams: { type: number, minimum: 0 }
        fatGrams: { type: number, minimum: 0 }
        notes: { type: [string, "null"] }
